<section class="search-results">
  @if (results().length) {
  <ul>
    @for (result of results(); track result) {
    <li>
      <button
        type="button"
        [class.active]="selectedMovie() === result"
        (click)="selectMovie(result)"
      >
        {{ result }}
      </button>
    </li>
    }
  </ul>
  } @else {
  <p class="empty">{{ mergedConfig().emptyMessage }}</p>
  }
</section>
