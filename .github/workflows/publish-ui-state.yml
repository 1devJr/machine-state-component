name: Publish ui-state

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version bump: patch, minor, major, or x.y.z'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Publish with npm --dry-run'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish-ui-state:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Bump ui-state version
        if: ${{ inputs.version != '' }}
        run: npm run version:ui-state -- ${{ inputs.version }}

      - name: Read package version
        id: package_version
        run: echo "value=$(node -p \"require('./libs/ui-state/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Test ui-state
        run: npm run test

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        run: npm run publish:ui-state:dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        if: ${{ !inputs.dry_run }}
        run: npm run publish:ui-state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and tag
        if: ${{ !inputs.dry_run && inputs.version != '' }}
        env:
          VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/ui-state/package.json
          if ! git diff --cached --quiet; then
            git commit -m "release(ui-state): v${VERSION}"
          fi
          if ! git rev-parse "ui-state-v${VERSION}" >/dev/null 2>&1; then
            git tag "ui-state-v${VERSION}"
          fi
          git push origin HEAD --follow-tags
